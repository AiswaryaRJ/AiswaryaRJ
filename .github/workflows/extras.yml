name: Generate Extras
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  extras:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pacman and Isometric SVGs
        env:
          USERNAME: AiswaryaRJ
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p extras
          python3 << 'EOF'
          import urllib.request, json, os, math

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["USERNAME"]

          # Fetch contribution data
          req = urllib.request.Request(
            f"https://api.github.com/users/{username}",
            headers={"Authorization": f"token {token}", "User-Agent": "extras-gen"}
          )
          user = json.loads(urllib.request.urlopen(req).read())
          repos_req = urllib.request.Request(
            f"https://api.github.com/users/{username}/repos?per_page=100",
            headers={"Authorization": f"token {token}", "User-Agent": "extras-gen"}
          )
          repos = json.loads(urllib.request.urlopen(repos_req).read())
          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)

          # ── PACMAN SVG ─────────────────────────────────────────
          dots = ""
          eaten = ""
          for i in range(18):
            x = 80 + i * 36
            if i < 10:
              eaten += f'<circle cx="{x}" cy="60" r="5" fill="#c9a84c" opacity="0.3"/>'
            else:
              dots += f'<circle cx="{x}" cy="60" r="5" fill="#c9a84c"/>'

          pacman_svg = f'''<svg width="750" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="750" height="120" fill="#09090b"/>
            <!-- eaten dots -->
            {eaten}
            <!-- remaining dots -->
            {dots}
            <!-- pacman body -->
            <g>
              <animateTransform attributeName="transform" type="translate" values="0,0;360,0" dur="3s" repeatCount="indefinite"/>
              <path d="M 60,60 L 90,45 A 30,30 0 1,1 90,75 Z" fill="#c9a84c">
                <animate attributeName="d"
                  values="M 60,60 L 90,45 A 30,30 0 1,1 90,75 Z;M 60,60 L 90,58 A 30,30 0 1,1 90,62 Z;M 60,60 L 90,45 A 30,30 0 1,1 90,75 Z"
                  dur="0.3s" repeatCount="indefinite"/>
              </path>
              <!-- eye -->
              <circle cx="72" cy="48" r="4" fill="#09090b"/>
            </g>
            <!-- label -->
            <text x="375" y="105" text-anchor="middle" fill="#3d3c4e" font-size="11" font-family="monospace">pacman · {username}</text>
          </svg>'''

          with open("extras/pacman.svg", "w") as f:
            f.write(pacman_svg)

          # ── ISOMETRIC CITY SVG ────────────────────────────────
          buildings = []
          repo_count = min(public_repos, 12)
          for i in range(max(repo_count, 6)):
            h = 40 + (i * 23 % 80)
            x = 60 + i * 55
            y = 220
            # isometric building faces
            # front face
            buildings.append(f'''
              <polygon points="{x},{y} {x+30},{y} {x+30},{y-h} {x},{y-h}" fill="#1a1a2e" stroke="#c9a84c" stroke-width="0.8"/>
              <polygon points="{x+30},{y} {x+45},{y-15} {x+45},{y-h-15} {x+30},{y-h}" fill="#13132a" stroke="#c9a84c" stroke-width="0.8"/>
              <polygon points="{x},{y-h} {x+30},{y-h} {x+45},{y-h-15} {x+15},{y-h-15}" fill="#c9a84c" opacity="0.7" stroke="#c9a84c" stroke-width="0.8"/>
              <rect x="{x+5}" y="{y-h+10}" width="8" height="10" fill="#c9a84c" opacity="0.6"/>
              <rect x="{x+17}" y="{y-h+10}" width="8" height="10" fill="#c9a84c" opacity="0.4"/>
            ''')

          iso_svg = f'''<svg width="750" height="280" xmlns="http://www.w3.org/2000/svg">
            <rect width="750" height="280" fill="#09090b"/>
            <!-- stars -->
            <circle cx="50" cy="30" r="1.5" fill="#7c7a8e"/>
            <circle cx="150" cy="20" r="1" fill="#7c7a8e"/>
            <circle cx="300" cy="40" r="1.5" fill="#7c7a8e"/>
            <circle cx="500" cy="15" r="1" fill="#7c7a8e"/>
            <circle cx="650" cy="35" r="1.5" fill="#7c7a8e"/>
            <circle cx="700" cy="60" r="1" fill="#7c7a8e"/>
            <!-- ground -->
            <rect x="0" y="220" width="750" height="60" fill="#0d0d1a"/>
            <line x1="0" y1="220" x2="750" y2="220" stroke="#1f1f28" stroke-width="1.5"/>
            <!-- buildings -->
            {"".join(buildings)}
            <!-- label -->
            <text x="375" y="268" text-anchor="middle" fill="#3d3c4e" font-size="11" font-family="monospace">isometric city · {repo_count} repos · {username}</text>
          </svg>'''

          with open("extras/isometric.svg", "w") as f:
            f.write(iso_svg)

          print("Extras generated!")
          EOF

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add extras/
          git commit -m "Update extras" || exit 0
          git push
