name: Generate Header
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Header SVG
        run: |
          mkdir -p header
          python3 << 'EOF'
          import random
          random.seed(42)

          # particles
          particles = ""
          for i in range(60):
            x = random.randint(0, 1200)
            y = random.randint(0, 220)
            r = random.choice([1, 1, 1.5, 2])
            op = round(random.uniform(0.15, 0.5), 2)
            particles += f'<circle cx="{x}" cy="{y}" r="{r}" fill="#c9a84c" opacity="{op}"/>'

          # particle connections
          points = [(random.randint(0,1200), random.randint(0,220)) for _ in range(20)]
          lines = ""
          for i, (x1,y1) in enumerate(points):
            for x2,y2 in points[i+1:i+3]:
              dist = ((x2-x1)**2+(y2-y1)**2)**0.5
              if dist < 250:
                op = round(0.12 - dist/2500, 2)
                lines += f'<line x1="{x1}" y1="{y1}" x2="{x2}" y2="{y2}" stroke="#c9a84c" stroke-width="0.5" opacity="{max(op,0.04)}"/>'

          # small particle dots on connection points
          pdots = ""
          for x,y in points:
            pdots += f'<circle cx="{x}" cy="{y}" r="1.5" fill="#c9a84c" opacity="0.25"/>'

          # geometric shapes
          geo = ""
          # hexagons
          def hex_path(cx, cy, r):
            import math
            pts = [(cx + r*math.cos(math.pi/180*(60*i-30)), cy + r*math.sin(math.pi/180*(60*i-30))) for i in range(6)]
            return "M " + " L ".join(f"{x:.1f},{y:.1f}" for x,y in pts) + " Z"

          hexagons = [(80,40,18,0.12),(1120,180,22,0.1),(150,180,12,0.08),
                      (1050,35,16,0.1),(600,15,10,0.07),(900,200,14,0.08)]
          for cx,cy,r,op in hexagons:
            geo += f'<path d="{hex_path(cx,cy,r)}" fill="none" stroke="#c9a84c" stroke-width="1" opacity="{op}"/>'

          # triangles
          triangles = [
            "M 30,10 L 65,10 L 47,40 Z",
            "M 1150,10 L 1190,10 L 1170,45 Z",
            "M 1100,190 L 1140,220 L 1060,220 Z",
            "M 60,190 L 100,220 L 20,220 Z",
            "M 550,5 L 570,5 L 560,22 Z",
          ]
          for t in triangles:
            geo += f'<path d="{t}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.1"/>'

          # diagonal accent lines
          geo += '<line x1="0" y1="60" x2="120" y2="0" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>'
          geo += '<line x1="1080" y1="0" x2="1200" y2="70" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>'
          geo += '<line x1="0" y1="160" x2="100" y2="220" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>'
          geo += '<line x1="1100" y1="220" x2="1200" y2="150" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>'

          # corner brackets
          brackets = ""
          for x,y,dx,dy in [(35,25,1,1),(1165,25,-1,1),(35,195,1,-1),(1165,195,-1,-1)]:
            brackets += f'<line x1="{x}" y1="{y}" x2="{x+dx*45}" y2="{y}" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>'
            brackets += f'<line x1="{x}" y1="{y}" x2="{x}" y2="{y+dy*45}" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>'

          svg = f'''<svg width="1200" height="220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nameglow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff"/>
                <stop offset="100%" style="stop-color:#e8e6f0"/>
              </linearGradient>
              <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#09090b"/>
                <stop offset="30%" style="stop-color:#c9a84c"/>
                <stop offset="70%" style="stop-color:#c9a84c"/>
                <stop offset="100%" style="stop-color:#09090b"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- background -->
            <rect width="1200" height="220" fill="#09090b"/>

            <!-- geometric elements -->
            {geo}

            <!-- particle lines -->
            {lines}

            <!-- particles -->
            {particles}
            {pdots}

            <!-- corner brackets -->
            {brackets}

            <!-- name -->
            <text x="600" y="102" text-anchor="middle"
              fill="url(#nameglow)" font-size="52"
              font-family="Georgia, serif" font-weight="bold"
              filter="url(#glow)">Aiswarya Rose Jacob</text>

            <!-- gold divider -->
            <line x1="200" y1="122" x2="1000" y2="122" stroke="url(#divider)" stroke-width="1"/>

            <!-- subtitle -->
            <text x="600" y="152" text-anchor="middle" fill="#c9a84c"
              font-size="13" font-family="monospace" letter-spacing="5">
              AI  ·  MACHINE LEARNING  ·  SYSTEMS ENGINEERING
            </text>
          </svg>'''

          with open("header/banner.svg", "w") as f:
            f.write(svg)
          print("Header generated!")
          EOF

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add header/
          git commit -m "Update header" || exit 0
          git push
        
