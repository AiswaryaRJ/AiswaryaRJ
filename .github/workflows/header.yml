name: Generate Header
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Header SVG
        run: |
          mkdir -p header
          python3 << 'EOF'
          import math, random
          random.seed(42)

          def hex_path(cx, cy, r):
            pts = [(cx + r*math.cos(math.pi/180*(60*i-30)), cy + r*math.sin(math.pi/180*(60*i-30))) for i in range(6)]
            return "M " + " L ".join(f"{x:.1f},{y:.1f}" for x,y in pts) + " Z"

          geo = ""

          # top-left cluster
          geo += f'<path d="{hex_path(40,35,30)}" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>'
          geo += f'<path d="{hex_path(85,20,16)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>'
          geo += f'<path d="{hex_path(20,80,18)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<path d="M 95,55 L 125,30 L 125,80 Z" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<line x1="0" y1="55" x2="130" y2="0" stroke="#c9a84c" stroke-width="0.6" opacity="0.2"/>'
          geo += '<line x1="0" y1="110" x2="80" y2="0" stroke="#c9a84c" stroke-width="0.5" opacity="0.12"/>'

          # top-right cluster
          geo += f'<path d="{hex_path(1160,35,30)}" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>'
          geo += f'<path d="{hex_path(1115,20,16)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>'
          geo += f'<path d="{hex_path(1180,80,18)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<path d="M 1105,55 L 1075,30 L 1075,80 Z" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<line x1="1200" y1="55" x2="1070" y2="0" stroke="#c9a84c" stroke-width="0.6" opacity="0.2"/>'
          geo += '<line x1="1200" y1="110" x2="1120" y2="0" stroke="#c9a84c" stroke-width="0.5" opacity="0.12"/>'

          # bottom-left cluster
          geo += f'<path d="{hex_path(40,185,30)}" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>'
          geo += f'<path d="{hex_path(85,205,16)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>'
          geo += f'<path d="{hex_path(20,140,18)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<path d="M 95,165 L 125,140 L 125,190 Z" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<line x1="0" y1="165" x2="130" y2="220" stroke="#c9a84c" stroke-width="0.6" opacity="0.2"/>'
          geo += '<line x1="0" y1="110" x2="80" y2="220" stroke="#c9a84c" stroke-width="0.5" opacity="0.12"/>'

          # bottom-right cluster
          geo += f'<path d="{hex_path(1160,185,30)}" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>'
          geo += f'<path d="{hex_path(1115,205,16)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>'
          geo += f'<path d="{hex_path(1180,140,18)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<path d="M 1105,165 L 1075,140 L 1075,190 Z" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>'
          geo += '<line x1="1200" y1="165" x2="1070" y2="220" stroke="#c9a84c" stroke-width="0.6" opacity="0.2"/>'
          geo += '<line x1="1200" y1="110" x2="1120" y2="220" stroke="#c9a84c" stroke-width="0.5" opacity="0.12"/>'

          # particles along 4 edges only
          particles = ""
          # top edge
          for _ in range(30):
            x = random.randint(150, 1050)
            y = random.randint(2, 25)
            r = random.choice([1, 1, 1.5])
            op = round(random.uniform(0.15, 0.35), 2)
            particles += f'<circle cx="{x}" cy="{y}" r="{r}" fill="#c9a84c" opacity="{op}"/>'
          # bottom edge
          for _ in range(30):
            x = random.randint(150, 1050)
            y = random.randint(195, 218)
            r = random.choice([1, 1, 1.5])
            op = round(random.uniform(0.15, 0.35), 2)
            particles += f'<circle cx="{x}" cy="{y}" r="{r}" fill="#c9a84c" opacity="{op}"/>'
          # left edge
          for _ in range(15):
            x = random.randint(2, 25)
            y = random.randint(30, 190)
            r = random.choice([1, 1, 1.5])
            op = round(random.uniform(0.15, 0.3), 2)
            particles += f'<circle cx="{x}" cy="{y}" r="{r}" fill="#c9a84c" opacity="{op}"/>'
          # right edge
          for _ in range(15):
            x = random.randint(1175, 1198)
            y = random.randint(30, 190)
            r = random.choice([1, 1, 1.5])
            op = round(random.uniform(0.15, 0.3), 2)
            particles += f'<circle cx="{x}" cy="{y}" r="{r}" fill="#c9a84c" opacity="{op}"/>'

          svg = f'''<svg width="1200" height="220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#09090b"/>
                <stop offset="30%" style="stop-color:#c9a84c"/>
                <stop offset="70%" style="stop-color:#c9a84c"/>
                <stop offset="100%" style="stop-color:#09090b"/>
              </linearGradient>
            </defs>

            <!-- background -->
            <rect width="1200" height="220" fill="#09090b"/>

            <!-- corner geometrics -->
            {geo}

            <!-- edge particles -->
            {particles}

            <!-- name -->
            <text x="600" y="102" text-anchor="middle"
              fill="#e8e6f0" font-size="52"
              font-family="Georgia, serif" font-weight="bold">Aiswarya Rose Jacob</text>

            <!-- gold divider -->
            <line x1="200" y1="122" x2="1000" y2="122" stroke="url(#divider)" stroke-width="1"/>

            <!-- subtitle -->
            <text x="600" y="152" text-anchor="middle" fill="#7c7a8e"
              font-size="13" font-family="monospace" letter-spacing="5">
              AI  ·  MACHINE LEARNING  ·  SYSTEMS ENGINEERING
            </text>
          </svg>'''

          with open("header/banner.svg", "w") as f:
            f.write(svg)
          print("Header generated!")
          EOF

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add header/
          git commit -m "Update header" || exit 0
          git push
