name: Generate Header
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Header SVG
        run: |
          mkdir -p header
          python3 << 'EOF'
          import math

          # geometric shapes only
          geo = ""

          # hexagons
          def hex_path(cx, cy, r):
            pts = [(cx + r*math.cos(math.pi/180*(60*i-30)), cy + r*math.sin(math.pi/180*(60*i-30))) for i in range(6)]
            return "M " + " L ".join(f"{x:.1f},{y:.1f}" for x,y in pts) + " Z"

          hexagons = [
            (80,40,22,0.12),(1120,180,26,0.1),(150,185,14,0.08),
            (1050,30,18,0.1),(200,30,10,0.07),(1000,195,12,0.08),
            (350,15,8,0.06),(850,210,10,0.06),(50,150,12,0.07),
            (1150,90,14,0.08),(500,205,9,0.05),(700,10,11,0.06),
          ]
          for cx,cy,r,op in hexagons:
            geo += f'<path d="{hex_path(cx,cy,r)}" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="{op}"/>'

          # triangles
          triangles = [
            "M 550,5 L 570,5 L 560,22 Z",
            "M 620,205 L 645,205 L 632,188 Z",
            "M 130,100 L 150,80 L 170,100 Z",
            "M 1030,110 L 1055,90 L 1080,110 Z",
            "M 400,195 L 418,195 L 409,180 Z",
            "M 780,8 L 800,8 L 790,25 Z",
          ]
          for t in triangles:
            geo += f'<path d="{t}" fill="none" stroke="#c9a84c" stroke-width="0.7" opacity="0.1"/>'

          # diagonal accent lines
          geo += '<line x1="0" y1="60" x2="120" y2="0" stroke="#c9a84c" stroke-width="0.5" opacity="0.1"/>'
          geo += '<line x1="1080" y1="0" x2="1200" y2="70" stroke="#c9a84c" stroke-width="0.5" opacity="0.1"/>'
          geo += '<line x1="0" y1="160" x2="100" y2="220" stroke="#c9a84c" stroke-width="0.5" opacity="0.1"/>'
          geo += '<line x1="1100" y1="220" x2="1200" y2="150" stroke="#c9a84c" stroke-width="0.5" opacity="0.1"/>'

          # grid dots (matrix feel)
          matrix = ""
          for x in range(0, 1200, 40):
            for y in range(0, 220, 40):
              matrix += f'<circle cx="{x}" cy="{y}" r="0.8" fill="#c9a84c" opacity="0.07"/>'

          svg = f'''<svg width="1200" height="220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#09090b"/>
                <stop offset="30%" style="stop-color:#c9a84c"/>
                <stop offset="70%" style="stop-color:#c9a84c"/>
                <stop offset="100%" style="stop-color:#09090b"/>
              </linearGradient>
            </defs>

            <!-- background -->
            <rect width="1200" height="220" fill="#09090b"/>

            <!-- matrix dots -->
            {matrix}

            <!-- geometric elements -->
            {geo}

            <!-- name -->
            <text x="600" y="102" text-anchor="middle"
              fill="#e8e6f0" font-size="52"
              font-family="Georgia, serif" font-weight="bold">Aiswarya Rose Jacob</text>

            <!-- gold divider -->
            <line x1="200" y1="122" x2="1000" y2="122" stroke="url(#divider)" stroke-width="1"/>

            <!-- subtitle -->
            <text x="600" y="152" text-anchor="middle" fill="#7c7a8e"
              font-size="13" font-family="monospace" letter-spacing="5">
              AI  ·  MACHINE LEARNING  ·  SYSTEMS ENGINEERING
            </text>
          </svg>'''

          with open("header/banner.svg", "w") as f:
            f.write(svg)
          print("Header generated!")
          EOF

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add header/
          git commit -m "Update header" || exit 0
          git push
