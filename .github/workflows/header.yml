name: Generate Header
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Header SVG
        run: |
          mkdir -p header
          python3 << 'EOF'
          import random
          random.seed(99)

          W, H = 1200, 220

          # generate random points for low-poly mesh
          points = []
          # edge points
          for x in range(0, W+1, 120):
            points.append((x, 0))
            points.append((x, H))
          for y in range(0, H+1, 55):
            points.append((0, y))
            points.append((W, y))
          # interior points
          for _ in range(80):
            points.append((random.randint(20, W-20), random.randint(5, H-5)))

          # simple delaunay-like triangulation using random triangles
          # we'll create a grid-based low poly manually for reliability
          triangles = []
          cols, rows = 12, 5
          cw, rh = W // cols, H // rows

          # create jittered grid
          grid = {}
          for r in range(rows + 1):
            for c in range(cols + 1):
              bx = c * cw
              by = r * rh
              jx = random.randint(-25, 25) if 0 < c < cols else 0
              jy = random.randint(-15, 15) if 0 < r < rows else 0
              grid[(c, r)] = (bx + jx, by + jy)

          # create triangles from grid quads
          for r in range(rows):
            for c in range(cols):
              p1 = grid[(c, r)]
              p2 = grid[(c+1, r)]
              p3 = grid[(c, r+1)]
              p4 = grid[(c+1, r+1)]
              # vary darkness per triangle
              d1 = random.randint(8, 18)
              d2 = random.randint(8, 18)
              triangles.append((p1, p2, p3, d1))
              triangles.append((p2, p4, p3, d2))

          # render triangles
          tri_svg = ""
          for (x1,y1),(x2,y2),(x3,y3),d in triangles:
            fill = f"#{d:02x}{d:02x}{d:02x}"
            tri_svg += f'<polygon points="{x1},{y1} {x2},{y2} {x3},{y3}" fill="{fill}" stroke="#c9a84c" stroke-width="0.6" stroke-opacity="0.45"/>'

          svg = f'''<svg width="{W}" height="{H}" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#09090b"/>
                <stop offset="30%" style="stop-color:#c9a84c"/>
                <stop offset="70%" style="stop-color:#c9a84c"/>
                <stop offset="100%" style="stop-color:#09090b"/>
              </linearGradient>
              <filter id="textglow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- background -->
            <rect width="{W}" height="{H}" fill="#09090b"/>

            <!-- low poly triangles -->
            {tri_svg}

            <!-- dark overlay to keep text readable -->
            <rect width="{W}" height="{H}" fill="#09090b" opacity="0.35"/>

            <!-- name -->
            <text x="600" y="102" text-anchor="middle"
              fill="#e8e6f0" font-size="52"
              font-family="Georgia, serif" font-weight="bold"
              filter="url(#textglow)">Aiswarya Rose Jacob</text>

            <!-- gold divider -->
            <line x1="200" y1="122" x2="1000" y2="122" stroke="url(#divider)" stroke-width="1"/>

            <!-- subtitle -->
            <text x="600" y="152" text-anchor="middle" fill="#7c7a8e"
              font-size="13" font-family="monospace" letter-spacing="5">
              AI  ·  MACHINE LEARNING  ·  SYSTEMS ENGINEERING
            </text>
          </svg>'''

          with open("header/banner.svg", "w") as f:
            f.write(svg)
          print("Header generated!")
          EOF

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add header/
          git commit -m "Update header" || exit 0
          git push
