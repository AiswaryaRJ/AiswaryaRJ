name: Generate Trophies
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ryo-ma/github-profile-trophy@master
        with:
          username: AiswaryaRJ
          theme: darkhub
          output_path: trophies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add trophies/
          git commit -m "Update trophies" || exit 0
          git push
