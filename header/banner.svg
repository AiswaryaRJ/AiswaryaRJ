<svg width="1200" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="40%" style="stop-color:#1a1608"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="30%" style="stop-color:#c9a84c"/>
      <stop offset="70%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#c9a84c" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="220" fill="url(#dots)"/>

  <!-- gold corner accents -->
  <line x1="40" y1="30" x2="40" y2="80" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="30" x2="90" y2="30" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="1160" y1="30" x2="1160" y2="80" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="1110" y1="30" x2="1160" y2="30" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="190" x2="40" y2="140" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="190" x2="90" y2="190" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="1160" y1="190" x2="1160" y2="140" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="1110" y1="190" x2="1160" y2="190" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>

  <!-- name -->
  <text x="600" y="105" text-anchor="middle" fill="#e8e6f0"
    font-size="52" font-family="Georgia, serif" font-weight="bold"
    filter="url(#glow)">Aiswarya Rose Jacob</text>

  <!-- gold divider line -->
  <line x1="200" y1="125" x2="1000" y2="125" stroke="url(#line)" stroke-width="1"/>

  <!-- subtitle -->
  <text x="600" y="155" text-anchor="middle" fill="#c9a84c"
    font-size="14" font-family="monospace" letter-spacing="4">
    AI  ·  MACHINE LEARNING  ·  SYSTEMS ENGINEERING
  </text>
</svg>